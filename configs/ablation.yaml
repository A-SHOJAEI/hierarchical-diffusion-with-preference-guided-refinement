# Ablation study configuration - Baseline without preference guidance

# Random seed for reproducibility
seed: 42

# Data parameters
image_size: 256
batch_size: 16
preference_batch_size: 8
max_samples_train: 1000
max_samples_val: 200
num_workers: 4

# Model architecture
hidden_dims: [64, 128, 256, 512]
text_embed_dim: 768
guidance_scale: 7.5

# Training parameters - Base diffusion
epochs: 10
learning_rate: 0.0001
min_lr: 0.000001
weight_decay: 0.01
gradient_clip: 1.0
mixed_precision: true

# Ablation: Disable preference refinement
# By not training preference stage, we test baseline diffusion only
preference_epochs: 0
preference_lr: 0.00005
preference_pairs: 5000
preference_margin: 0.5
preference_temperature: 1.0

# Early stopping
patience: 5
min_delta: 0.0001

# Diffusion parameters
num_train_timesteps: 1000
num_inference_steps: 50
beta_start: 0.00085
beta_end: 0.012
beta_schedule: scaled_linear

# LoRA adapter parameters (not used in baseline)
adapter_rank: 4
adapter_alpha: 1.0

# Evaluation parameters
eval_batch_size: 8
eval_num_samples: 100

# Logging
log_interval: 10
save_interval: 1
